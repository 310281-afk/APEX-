document.addEventListener('mousedown',e=>{if(e.button===0&&running)mouseDown=true});
document.addEventListener('mouseup',e=>{if(e.button===0)mouseDown=false});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement===R.domElement||(fb&&(e.buttons&2))){
    yaw-=e.movementX*.0022*SAVE.sens;pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*.0022*SAVE.sens));
  }
});
let started=false;
function setRun(v){running=v;if(v)started=true;ovEl.style.display=v?'none':'flex';if(!v){keys={};mouseDown=false;saveGame();renderMenu()}}
const ovEl=$('ov');
document.addEventListener('pointerlockchange',()=>{const l=document.pointerLockElement===R.domElement;if(l)fb=false;setRun(l||fb)});
document.addEventListener('pointerlockerror',()=>{fb=true;setRun(true)});

addEventListener('beforeunload',e=>{saveGame();if(started&&SAVE.guard!==false){e.preventDefault();e.returnValue='';return ''}});
function openBlob(){
  try{
    const u=URL.createObjectURL(new Blob([SRC],{type:'text/html'}));
    const w=window.open(u,'_blank');
    if(w){msg('已在 Blob 页面打开','#7cffcb')}
    else{msg('弹窗被拦截，改为在当前框架打开 Blob 页面','#ff753b');started=false;location.href=u}
  }catch(err){msg('Blob 打开失败','#ff3b5c')}
}
// ---------- Main loop ----------
const STEP=1/120;let acc=0,last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.1);last=now;
  ema+=(dt-ema)*.05;if(++fc>90){fc=0;if(ema>.024&&pr>.75){pr-=.25;R.setPixelRatio(pr);R.setSize(innerWidth,innerHeight)}}
  if(running){acc+=dt;let n=0;while(acc>=STEP&&n++<8){sim(STEP);acc-=STEP}if(acc>STEP*3)acc=0;}else acc=0;
  // camera
  const sp=hs(p),tY=p.y+(p.sliding?.75:1.62);camY+=(tY-camY)*Math.min(1,dt*18);if(Math.abs(camY-tY)>1.2)camY=tY;
  shake*=Math.pow(.003,dt);kick*=Math.pow(.0005,dt);
  cam.position.set(p.x+(Math.random()-.5)*shake*.3,camY+(Math.random()-.5)*shake*.3,p.z+(Math.random()-.5)*shake*.3);
  let rt=-(p.vx*Math.cos(yaw)-p.vz*Math.sin(yaw))*.004;if(p.wallRun&&p.wn)rt-=(p.wn[0]*Math.cos(yaw)-p.wn[1]*Math.sin(yaw))*.12;roll+=(Math.max(-.15,Math.min(.15,rt))-roll)*Math.min(1,dt*8);
  cam.rotation.set(Math.min(1.55,pitch+recoil),yaw,roll);recoil*=Math.pow(.0005,dt);
  if(!prig){initPrig();refreshWeapon();wpGlow.material=wid===4?GLMG:GLMV;prig.glow.material=wid===4?GLMG:GLMP}
  prig.root.visible=tp;wp.visible=!tp;
  if(tp){
    const bx=Math.sin(yaw)*Math.cos(pitch),by=-Math.sin(pitch),bz=Math.cos(yaw)*Math.cos(pitch),o={x:cam.position.x,y:cam.position.y,z:cam.position.z},d={x:bx,y:by,z:bz};
    let D=4.6;for(const k of boxes){const h=rayBox(o,d,k,D);if(h!==null&&h<D)D=Math.max(.5,h-.3)}
    cam.position.set(o.x+bx*D+Math.cos(yaw)*.55,o.y+by*D+.25,o.z+bz*D-Math.sin(yaw)*.55);
  }
  animPlayer(dt);stepCorpses(dt);
  const tf=78+Math.min(sp*.9,32)+(p.grap?6:0)+(p.dashT>0?16:0)+(p.btT>0?-8:0)+(p.gl?8:0)+(wid===2&&keys.KeyZ?-45:0)+(p.hasteT>0?6:0);fov+=(tf-fov)*Math.min(1,dt*6);if(Math.abs(cam.fov-fov)>.05){cam.fov=fov;cam.updateProjectionMatrix()}
  {const wt=now/1000,mv=p.grounded&&!p.sliding?Math.min(1,sp/12):0,fast=sp>16&&p.grounded;
  wp.position.set(.26+Math.sin(wt*9)*.012*mv-(p.sliding?.08:0),-.22+Math.abs(Math.sin(wt*9))*.016*mv-(p.sliding?.06:0)-(p.dashT>0?.05:0),-.55+kick*.08+(p.dashT>0?.12:0));
  wp.rotation.set(kick*.12+(fast?.22:0)+(p.gl?-.2:0),(fast?-.25:0)+(p.dashT>0?.2:0),(p.sliding?.35:0)+roll*.5);
  wpf.visible=flashT>0;if(flashT>0)wpf.scale.setScalar(.7+Math.random()*.8);wpGlow.material.opacity=.6+.35*Math.sin(wt*(wid===4?9:5))+(flashT>0?.3:0);if(godVm){godVm.visible=wid===4&&!tp;godVm.rotation.z+=dt*5}if(godRig){godRig.visible=wid===4&&tp;godRig.rotation.y+=dt*5}}
  // grapple line
  gl.visible=p.grap;
  if(p.grap){const a=gl.geometry.attributes.position;a.setXYZ(0,p.x,p.y+1.2,p.z);a.setXYZ(1,p.gx,p.gy,p.gz);a.needsUpdate=true}
  for(const e of enemies){
    e.m.position.set(e.x,e.y,e.z);e.m.rotation.y=Math.atan2(-(p.x-e.x),-(p.z-e.z));e.m.scale.setScalar(e.ty===3?2:1);animEnemy(e,dt);
    if(e.ty===3||e.ty===4){const au=e.m.userData.aura;if(au)au.material.opacity=e.bshield>0?.55:.14+.08*Math.sin(now/180);if(e.ty===3&&Math.random()<.3){const a=Math.random()*6.28;boltTo(e.x,e.y+3,e.z,e.x+Math.cos(a)*4,e.y+Math.random()*5,e.z+Math.sin(a)*4,.08,1.5)}if(e.ty===4&&(hs(e)>26||e.dashT>0)&&Math.random()<.5)ghostAt(e.x,e.y,e.z,e.m.rotation.y,0xff4a4a)}
  }
  $('bt').style.opacity=p.btT>0?1:0;
  {const bo=enemies.find(e=>e.ty===3||(e.ty===4&&!e.mini));$('boss').style.display=bo?'block':'none';if(bo)$('bossBar').style.width=Math.max(0,bo.hp/bo.hpMax*100)+'%'}
  if(running&&(sp>22||p.dashT>0))burst(p.x,p.y+.9,p.z,p.dashT>0?0x7cffcb:0x00a0ff,p.dashT>0?4:1,.6);
  if(running&&p.gl&&Math.random()<.5)burst(p.x,p.y+1.2,p.z,0xb69cff,1,.5);
  if(running&&p.btT>0)for(const e of enemies)if(Math.random()<.2)burst(e.x,e.y+.9,e.z,0xff3b5c,1,.3);
  updWeather(dt);stepFx(dt);stepDebris(dt);stepBolts(dt);stepArcs(dt);stepWallFx(dt);stepGhosts(dt);mzLight.intensity*=Math.pow(.00001,dt);updSkillFx(now,dt);
  if((sp>26||p.dashT>0)&&tp&&now-lastGhost>40){ghostAt(p.x,p.y,p.z,yaw,p.dashT>0?0xffffff:0x66f6ff);lastGhost=now}
  for(const al of allies){al.m.position.set(al.x,al.y,al.z);al.m.rotation.y=al.fy;animEnemy(al,dt);const au=al.m.userData.aura;if(au)au.material.opacity=.14+.08*Math.sin(now/180);if((hs(al)>26||al.dashT>0)&&Math.random()<.5)ghostAt(al.x,al.y,al.z,al.fy,0x39ff9a)}
  updParticles(dt);
  R.render(scene,cam);updFlare();
  // HUD
  if(fc%3===0){$('spdfx').style.opacity=Math.max(0,Math.min(.85,(sp-24)/22));$('ga').style.opacity=wid===4&&wOwned[4]?.5+.3*Math.sin(now/200):0;$('ha').style.opacity=p.healT>0?.6:0;
  {const cd=v=>v>0?Math.ceil(v)+'s':'就绪';$('sk2').textContent='神器Lv'+godLv+' | 治疗[H] '+cd(p.healCd)+' | 盾牌[B] '+cd(p.shCd)+' | 分身[N] '+cd(p.clCd)+(finalOn?' | 终局!':'');$('sk3').textContent='雷击[R] '+cd(p.thCd)+' | 护罩[O] '+cd(p.odCd)+' | 疾风[L] '+cd(p.haCd)+' | 无人机[P] '+cd(p.drCd)+' | 燃料 '+'▮'.repeat(Math.max(0,Math.ceil(p.fuel*4/1.5)))}$('hpBar').style.width=(p.hp/p.maxHp*100)+'%';$('hpT').textContent='战甲护盾: '+Math.floor(p.hp)+'/'+p.maxHp;
  const rdy=p.skillCd<=0;$('skBar').style.width=rdy?'100%':((1.2-p.skillCd)/1.2*100)+'%';
  $('skT').textContent='战术抓钩 [E]: '+(rdy?'就绪':'冷却中')+(p.rapT>0?' | 速射 '+Math.ceil(p.rapT):'')+(p.ovT>0?' | 超载 '+Math.ceil(p.ovT):'')+(p.lgT>0?' | 低重力 '+Math.ceil(p.lgT):'')+(sp>20?' | 心流(减伤)':'');
  $('sc').textContent='击杀数: '+kills+' | 场景敌人: '+enemies.length+' | 连击 x'+combo+' | 得分 '+Math.floor(score)+' | 武器: '+WEAPONS[wid].n+' | 世界: '+WORLDS[world].name+(world===0?' | 天气: '+WX[wxMode].n:'')+(exitT>0?' | 即将返回...':'')+' | 金币 '+Math.floor(SAVE.coins);
  $('bh').style.display=p.bhop>0?'block':'none';$('bh').textContent='极限 BHOP 连跳中！x'+p.bhop;
  $('spd').textContent='速度: '+sp.toFixed(1)+' m/s | 冲刺[Q]: '+'■'.repeat(p.dashCh)+'□'.repeat(2-p.dashCh)+' | 子弹时间[F]: '+(p.btT>0?'生效 '+p.btT.toFixed(1):p.btCd>0?Math.ceil(p.btCd)+'s':'就绪')+' | 雷[G]: '+(p.grCd>0?Math.ceil(p.grCd)+'s':'就绪')+' | 瞬移[T]: '+(p.blCd>0?Math.ceil(p.blCd)+'s':'就绪')+(p.gl?' | 滑翔中':'');};
}
for(let i=0;i<6;i++)spawnEnemy();
renderMenu('home');
requestAnimationFrame(frame);
</script>
